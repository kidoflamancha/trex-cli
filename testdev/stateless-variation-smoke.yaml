apiVersion: trex.example.io/v1
kind: StatelessTraffic
metadata:
  name: testdev-variation-1pps-4s
spec:
  safety:
    isolatedLab: true
  ports:
    tx: lab-west
    rx: lab-east
    direction: unidirectional
  limits:
    portWaitTimeout: 30s
    jobTimeout: 30s
  packet:
    frameSize: 128
    ethernet:
      src: 02:00:00:02:00:00
      dst: 02:00:00:02:00:00
    ipv4:
      src:
        start: 198.18.0.1
        end: 198.18.0.4
        mode: increment
      dst: 198.19.0.1
    udp:
      srcPort:
        start: 49152
        end: 49155
        mode: increment
      dstPort: 7
  rate:
    unit: pps
    value: 1
  duration: 4s
  assertions:
    maxLossPercent: 0
