apiVersion: trex.example.io/v1
kind: StatelessTraffic
metadata:
  name: l3-mac-variation-smoke
  labels:
    purpose: real-trex-mac-variation-smoke
spec:
  safety:
    isolatedLab: true
  ports:
    tx: lab-west
    rx: lab-east
    direction: unidirectional
  limits:
    portWaitTimeout: 30s
    jobTimeout: 30s
  packet:
    frameSize: 128
    ethernet:
      src:
        start: "02:00:00:02:00:00"
        end: "02:00:00:02:00:00"
        mode: increment
      dst: "02:00:00:02:00:00"
    ipv4:
      src: "198.18.0.1"
      dst: "198.19.0.1"
    udp:
      srcPort: 49152
      dstPort: 7
  rate:
    unit: pps
    value: 1
  duration: 4s
  assertions:
    maxLossPercent: 0
