apiVersion: trex.example.io/v1
kind: StatelessTraffic
metadata:
  name: l2-fixed-mac-control
  labels:
    purpose: real-trex-l2-mac-control
spec:
  safety:
    isolatedLab: true
  ports:
    tx: lab-west
    rx: lab-east
    direction: unidirectional
  limits:
    portWaitTimeout: 30s
    jobTimeout: 30s
  packet:
    frameSize: 128
    ethernet:
      src: "02:00:00:02:00:00"
      dst: "02:00:00:02:00:00"
    payloadHex: "4d41432d564152"
  rate:
    unit: pps
    value: 1
  duration: 10s
  assertions:
    maxLossPercent: 0
