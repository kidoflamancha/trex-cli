apiVersion: trex.example.io/v1
kind: Rfc2544Throughput
metadata:
  name: testdev-rfc2544-fast-64
spec:
  safety:
    isolatedLab: true
  ports:
    tx: lab-west
    rx: lab-east
    direction: unidirectional
  mode: fast
  frameSizes: [64]
  limits:
    portWaitTimeout: 30s
    jobTimeout: 30s
  packet:
    ethernet:
      src: 02:00:00:02:00:00
      dst: 02:00:00:02:00:00
    ipv4:
      src: 198.18.0.1
      dst: 198.19.0.1
    udp:
      srcPort: 49152
      dstPort: 7
  assertion:
    minimumPercentLineRate:
      "64": 0.001
