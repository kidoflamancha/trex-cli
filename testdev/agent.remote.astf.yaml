bindHost: 127.0.0.1
bindPort: 48080
databasePath: .state/astf-jobs.sqlite3
artifactRoot: .state/astf-artifacts
trafficProfileRoot: ../traffic-profiles
labPathRoot: ../lab-paths
planRoot: .state/astf-plans
captureRoot: .state/astf-captures
logicalPorts: [lab-west, lab-east]
engine:
  mode: remote-astf
  server: 127.0.0.1
  syncPort: 14501
  asyncPort: 14500
  clientPath: ../.trex-client/v3.08/interactive
  externalLibsPath: ../.trex-client/local-external-libs
  username: trex-cli-astf
  timeoutSeconds: 5
  portMapping:
    lab-west: 0
    lab-east: 1
safety:
  version: testdev-astf-v1
  allowedCidrs: [198.18.0.0/15]
  allowedMacPrefixes: ["02:00:00", "02:00:00"]
  maxConcurrentJobs: 1
  maxJobTimeout: 10m
  maxPortWaitTimeout: 30s
  maxRunDuration: 10s
  maxBurstPackets: 1000000
  maxPercentL1: 100
  maxPps: 40000000
  maxBpsL1: 2500000000
  maxBpsL2: 2500000000
  maxCps: 100
  maxActiveConnections: 1000
  maxAddressPoolSize: 256
auth:
  tokens:
    - name: testdev-operator
      role: operator
      env: TREX_OPERATOR_TOKEN
    - name: testdev-reader
      role: read-only
      env: TREX_READER_TOKEN
