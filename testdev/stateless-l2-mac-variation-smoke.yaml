apiVersion: trex.example.io/v1
kind: StatelessTraffic
metadata:
  name: l2-mac-variation-smoke
  labels:
    purpose: real-trex-mac-variation-smoke
spec:
  safety:
    isolatedLab: true
  ports:
    tx: lab-west
    rx: lab-east
    direction: unidirectional
  limits:
    portWaitTimeout: 30s
    jobTimeout: 30s
  packet:
    frameSize: 128
    ethernet:
      src:
        start: "02:00:00:02:00:00"
        end: "02:00:00:02:00:00"
        mode: increment
      dst: "02:00:00:02:00:00"
    payloadHex: "4d41432d564152"
  rate:
    unit: pps
    value: 1
  duration: 10s
  assertions:
    maxLossPercent: 0
