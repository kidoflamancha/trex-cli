name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install locked development environment
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .

      - name: Validate schemas and release resources
        run: python -m trex_cli.release_validation --root .

      - name: Run static and contract gates
        run: |
          ruff check src tests
          mypy --strict src/trex_cli
          pytest

      - name: Build wheel
        run: |
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir dist .
          sha256sum dist/*.whl | tee dist/checksums.sha256

      - name: Smoke test wheel in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/trex-cli-wheel-smoke"
          "$RUNNER_TEMP/trex-cli-wheel-smoke/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/trex-cli-wheel-smoke/bin/trex-cli" --help
          "$RUNNER_TEMP/trex-cli-wheel-smoke/bin/trex-agent" --help

      - uses: actions/upload-artifact@v4
        with:
          name: trex-cli-wheel
          path: |
            dist/*.whl
            dist/checksums.sha256
            CHANGELOG.md
            docs/compatibility.md
            docs/operations.md
            deploy/
          if-no-files-found: error
