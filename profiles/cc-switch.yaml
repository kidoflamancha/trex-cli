apiVersion: trex.example.io/v1
kind: StatelessTraffic
metadata:
  name: cc-switch
  labels:
    profile: cc-switch
spec:
  safety:
    isolatedLab: true
  ports:
    tx: lab-west
    rx: lab-east
    direction: unidirectional
  limits:
    portWaitTimeout: 30s
    jobTimeout: 30s
  packet:
    frameSize: 128
    ethernet:
      src: "00:00:00:00:00:01"
      dst: "00:00:00:00:00:02"
    ipv4:
      src: "198.18.0.1"
      dst: "198.19.0.1"
    udp:
      srcPort: 49152
      dstPort: 7
  rate:
    unit: pps
    value: 1000
  duration: 10s
  assertions:
    maxLossPercent: 0
